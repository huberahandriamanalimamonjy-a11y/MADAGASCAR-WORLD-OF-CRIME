
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Madagascar: World of Crime</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  overflow: hidden;
  background: #101820;
  font-family: Arial, sans-serif;
  color: white;
}

#game {
  width: 100vw;
  height: 100vh;
  display: block;
}

#loading {
  position: fixed;
  inset: 0;
  background: #101820;
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 10;
  text-align: center;
  flex-direction: column;
  gap: 15px;
}

#loading h1 {
  font-size: 25px;
  color: #55d6a4;
}

#hud {
  position: fixed;
  top: 15px;
  left: 15px;
  z-index: 2;
  background: #0009;
  padding: 12px;
  border-radius: 12px;
  font-size: 13px;
}

#hud strong {
  color: #55d6a4;
}

#controls {
  position: fixed;
  bottom: 25px;
  left: 20px;
  z-index: 3;
  display: grid;
  grid-template-columns: 55px 55px 55px;
  grid-template-rows: 55px 55px;
  gap: 5px;
}

.control {
  border: 1px solid #ffffff66;
  background: #172a36cc;
  color: white;
  border-radius: 14px;
  font-size: 23px;
  touch-action: none;
}

#up { grid-column: 2; }
#left { grid-column: 1; grid-row: 2; }
#down { grid-column: 2; grid-row: 2; }
#right { grid-column: 3; grid-row: 2; }

#jump {
  position: fixed;
  right: 25px;
  bottom: 40px;
  z-index: 3;
  width: 75px;
  height: 75px;
  border-radius: 50%;
  background: #168d69dd;
  color: white;
  border: 2px solid white;
  font-size: 14px;
  font-weight: bold;
  touch-action: none;
}

#message {
  position: fixed;
  top: 15px;
  right: 15px;
  background: #0009;
  border-radius: 10px;
  padding: 10px;
  font-size: 12px;
  z-index: 2;
}

</style>
</head>

<body>

<div id="loading">
  <h1>MADAGASCAR</h1>
  <h2>WORLD OF CRIME</h2>
  <p>Chargement du monde 3D...</p>
</div>

<div id="hud">
  <strong>WORLD OF CRIME</strong><br>
  Mode : Exploration<br>
  Ville : Antananarivo<br>
  <span id="position">Position : 0 / 0</span>
</div>

<div id="message">
  VERSION 0.1<br>
  Prototype 3D
</div>

<div id="controls">
  <button class="control" id="up">▲</button>
  <button class="control" id="left">◀</button>
  <button class="control" id="down">▼</button>
  <button class="control" id="right">▶</button>
</div>

<button id="jump">SAUTER</button>

<canvas id="game"></canvas>

<script type="module">
import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const loading = document.getElementById("loading");
const canvas = document.getElementById("game");

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87bce0);
scene.fog = new THREE.Fog(0x87bce0, 60, 250);

const camera = new THREE.PerspectiveCamera(
  65,
  window.innerWidth / window.innerHeight,
  0.1,
  500
);

const renderer = new THREE.WebGLRenderer({
  canvas,
  antialias: true
});

renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

scene.add(new THREE.HemisphereLight(0xffffff, 0x526044, 2));

const sun = new THREE.DirectionalLight(0xffffff, 2.5);
sun.position.set(40, 80, 30);
sun.castShadow = true;
scene.add(sun);

// Terrain
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(500, 500),
  new THREE.MeshStandardMaterial({
    color: 0x54794a,
    roughness: 1
  })
);

ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// Roads
function createRoad(x, z, width, length) {
  const road = new THREE.Mesh(
    new THREE.PlaneGeometry(width, length),
    new THREE.MeshStandardMaterial({
      color: 0x30343a,
      roughness: 0.95
    })
  );

  road.rotation.x = -Math.PI / 2;
  road.position.set(x, 0.03, z);
  scene.add(road);
}

createRoad(0, 0, 18, 400);
createRoad(0, 0, 400, 18);

// Road markings
const lineMaterial = new THREE.MeshBasicMaterial({
  color: 0xf3d45b
});

for (let i = -190; i < 200; i += 15) {
  const line = new THREE.Mesh(
    new THREE.PlaneGeometry(0.35, 7),
    lineMaterial
  );

  line.rotation.x = -Math.PI / 2;
  line.position.set(0, 0.06, i);
  scene.add(line);
}

// Buildings
const buildingMaterials = [
  0xb5a28a, 0xd0c5b2, 0x8c9ba5,
  0xc0a28b, 0x9caa91, 0xd3d0c4
].map(color => new THREE.MeshStandardMaterial({
  color,
  roughness: 0.85
}));

function createBuilding(x, z) {
  const width = 8 + Math.random() * 9;
  const depth = 8 + Math.random() * 9;
  const height = 8 + Math.random() * 30;

  const building = new THREE.Mesh(
    new THREE.BoxGeometry(width, height, depth),
    buildingMaterials[
      Math.floor(Math.random() * buildingMaterials.length)
    ]
  );

  building.position.set(x, height / 2, z);
  building.castShadow = true;
  building.receiveShadow = true;
  scene.add(building);

  // Windows
  const windowMaterial = new THREE.MeshStandardMaterial({
    color: 0x6b9cae,
    roughness: 0.35,
    metalness: 0.2
  });

  for (let y = 3; y < height - 2; y += 4) {
    for (let wx = -width / 2 + 2; wx < width / 2 - 1; wx += 3) {
      const windowMesh = new THREE.Mesh(
        new THREE.BoxGeometry(1.3, 1.6, 0.12),
        windowMaterial
      );

      windowMesh.position.set(
        x + wx,
        y,
        z + depth / 2 + 0.07
      );

      scene.add(windowMesh);
    }
  }
}

// Create city blocks
for (let x = -100; x <= 100; x += 25) {
  for (let z = -100; z <= 100; z += 25) {
    if (Math.abs(x) > 13 || Math.abs(z) > 13) {
      if (Math.random() > 0.2) {
        createBuilding(x, z);
      }
    }
  }
}

// Trees
function createTree(x, z) {
  const trunk = new THREE.Mesh(
    new THREE.CylinderGeometry(0.35, 0.5, 4),
    new THREE.MeshStandardMaterial({ color: 0x684329 })
  );

  trunk.position.set(x, 2, z);
  scene.add(trunk);

  const leaves = new THREE.Mesh(
    new THREE.SphereGeometry(2.5, 10, 8),
    new THREE.MeshStandardMaterial({ color: 0x287d3c })
  );

  leaves.position.set(x, 5, z);
  scene.add(leaves);
}

for (let i = 0; i < 70; i++) {
  const x = (Math.random() - 0.5) * 450;
  const z = (Math.random() - 0.5) * 450;

  if (Math.abs(x) > 12 && Math.abs(z) > 12) {
    createTree(x, z);
  }
}

// Player
const player = new THREE.Group();

const body = new THREE.Mesh(
  new THREE.CapsuleGeometry(0.55, 1.1, 4, 8),
  new THREE.MeshStandardMaterial({ color: 0x1769aa })
);

body.position.y = 1.4;
body.castShadow = true;
player.add(body);

const head = new THREE.Mesh(
  new THREE.SphereGeometry(0.42, 16, 16),
  new THREE.MeshStandardMaterial({ color: 0xc98f65 })
);

head.position.y = 2.45;
player.add(head);

const legs = new THREE.Mesh(
  new THREE.BoxGeometry(0.8, 0.5, 0.5),
  new THREE.MeshStandardMaterial({ color: 0x202c38 })
);

legs.position.y = 0.35;
player.add(legs);

player.position.set(0, 0, 0);
scene.add(player);

// Controls
const keys = {
  up: false,
  down: false,
  left: false,
  right: false
};

function bindButton(id, key) {
  const button = document.getElementById(id);

  button.addEventListener("pointerdown", event => {
    event.preventDefault();
    keys[key] = true;
  });

  ["pointerup", "pointercancel", "pointerleave"].forEach(type => {
    button.addEventListener(type, () => {
      keys[key] = false;
    });
  });
}

bindButton("up", "up");
bindButton("down", "down");
bindButton("left", "left");
bindButton("right", "right");

window.addEventListener("keydown", event => {
  if (event.key === "ArrowUp" || event.key === "w") keys.up = true;
  if (event.key === "ArrowDown" || event.key === "s") keys.down = true;
  if (event.key === "ArrowLeft" || event.key === "a") keys.left = true;
  if (event.key === "ArrowRight" || event.key === "d") keys.right = true;
});

window.addEventListener("keyup", event => {
  if (event.key === "ArrowUp" || event.key === "w") keys.up = false;
  if (event.key === "ArrowDown" || event.key === "s") keys.down = false;
  if (event.key === "ArrowLeft" || event.key === "a") keys.left = false;
  if (event.key === "ArrowRight" || event.key === "d") keys.right = false;
});

// Jump
let jumping = false;
let velocityY = 0;

document.getElementById("jump").addEventListener("pointerdown", () => {
  if (!jumping) {
    velocityY = 0.18;
    jumping = true;
  }
});

// Camera
camera.position.set(0, 6, 10);

const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);

  const delta = Math.min(clock.getDelta(), 0.05);
  const speed = 12 * delta;

  if (keys.up) player.position.z -= speed;
  if (keys.down) player.position.z += speed;
  if (keys.left) player.position.x -= speed;
  if (keys.right) player.position.x += speed;

  if (keys.up || keys.down || keys.left || keys.right) {
    player.rotation.y = Math.atan2(
      keys.left ? -1 : keys.right ? 1 : 0,
      keys.up ? -1 : keys.down ? 1 : 0
    );
  }

  // Jump physics
  if (jumping) {
    player.position.y += velocityY;
    velocityY -= 0.009;

    if (player.position.y <= 0) {
      player.position.y = 0;
      jumping = false;
      velocityY = 0;
    }
  }

  // Follow camera
  const targetCamera = new THREE.Vector3(
    player.position.x,
    player.position.y + 5,
    player.position.z + 9
  );

  camera.position.lerp(targetCamera, 0.08);

  camera.lookAt(
    player.position.x,
    player.position.y + 1.5,
    player.position.z
  );

  document.getElementById("position").textContent =
    "Position : " +
    Math.round(player.position.x) +
    " / " +
    Math.round(player.position.z);

  renderer.render(scene, camera);
}

window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

loading.style.display = "none";
animate();

</script>
</body>
</html>
